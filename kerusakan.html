
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laporan Kerusakan | Sapras Sekolah</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="header-container"></div>

    <main class="container my-4 flex-grow-1">

        <h1 class="h3 fw-bold mb-3">Laporan Kerusakan</h1>

        <div id="notifikasi" class="alert d-none" role="alert"></div>

        <!-- FORM LAPORAN -->
        <div class="card p-4 mb-4 shadow-sm" id="formLaporanCard">
            <h2 class="h5 mb-3">Buat Laporan Kerusakan</h2>

            <form id="laporanForm" class="row g-3">

                <div class="col-md-6">
                    <label for="barang_id" class="form-label">Barang</label>
                    <select class="form-select" id="barang_id" required>
                        <option value="">Pilih barang</option>
                    </select>
                </div>

                <div class="col-md-6">
                    <label for="pelapor" class="form-label">Nama Pelapor</label>
                    <input type="text" class="form-control"
                           id="pelapor" maxlength="100" required>
                </div>

                <div class="col-md-6">
                    <label for="tanggal" class="form-label">Tanggal Laporan</label>
                    <input type="date" class="form-control"
                           id="tanggal" required>
                </div>

                <div class="col-12">
                    <label for="deskripsi" class="form-label">Deskripsi Kerusakan</label>
                    <textarea class="form-control" id="deskripsi"
                              rows="3" required></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="btnKirim">
                        Kirim Laporan
                    </button>
                </div>

            </form>
        </div>

        <!-- DAFTAR LAPORAN -->
        <div class="card p-3 shadow-sm">
            <h2 class="h5 mb-3">Daftar Laporan</h2>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Barang</th>
                            <th>Pelapor</th>
                            <th>Deskripsi</th>
                            <th>Status &amp; Tindak Lanjut</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelLaporan">
                        <tr>
                            <td colspan="6" class="text-center py-3">
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        // =========================
        // PEMERIKSAAN LOGIN DAN ROLE
        // =========================

        let akunAktif = null;

        try {
            akunAktif = JSON.parse(localStorage.getItem('user') || 'null');
        } catch (error) {
            localStorage.removeItem('user');
        }

        const roleAktif = String(akunAktif?.role || '')
            .toLowerCase()
            .trim();

        const loginValid = Boolean(
            akunAktif && ['admin', 'petugas'].includes(roleAktif)
        );

        if (!loginValid) {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // =========================
        // TANGGAL LOKAL
        // =========================

        function tanggalLokal() {
            const sekarang = new Date();
            const tahun = sekarang.getFullYear();
            const bulan = String(sekarang.getMonth() + 1).padStart(2, '0');
            const hari = String(sekarang.getDate()).padStart(2, '0');

            return `${tahun}-${bulan}-${hari}`;
        }

        document.getElementById('tanggal').value = tanggalLokal();

        // =========================
        // NOTIFIKASI
        // =========================

        let timerNotifikasi;

        function tampilkanNotifikasi(pesan, tipe = 'success') {
            const elemen = document.getElementById('notifikasi');

            clearTimeout(timerNotifikasi);

            elemen.textContent = pesan;
            elemen.className = 'alert alert-' + tipe;
            elemen.style.display = 'block';

            elemen.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });

            timerNotifikasi = setTimeout(() => {
                elemen.classList.add('d-none');
                elemen.style.display = 'none';
            }, 4000);
        }

        // =========================
        // ATUR MENU BERDASARKAN ROLE
        // =========================

        function aturMenuBerdasarkanRole() {
            const menuAdmin = [
                'barang.html',
                'kerusakan.html',
                'stok_admin.html'
            ];

            document.querySelectorAll('#header-container a[href]')
                .forEach(link => {
                    const href = (link.getAttribute('href') || '')
                        .split('?')[0];

                    const namaHalaman = href.split('/').pop().toLowerCase();
                    const itemMenu = link.closest('li.nav-item') || link;

                    if (menuAdmin.includes(namaHalaman)) {
                        itemMenu.style.display =
                            roleAktif === 'admin' ? '' : 'none';
                    }
                });
        }

        // =========================
        // HEADER DAN FOOTER
        // =========================

        async function loadIncludes() {
            try {
                const [hRes, fRes] = await Promise.all([
                    fetch('header.html'),
                    fetch('footer.html')
                ]);

                if (!hRes.ok || !fRes.ok) {
                    throw new Error('Header atau footer gagal dimuat.');
                }

                document.getElementById('header-container').innerHTML =
                    await hRes.text();

                document.getElementById('footer-container').innerHTML =
                    await fRes.text();

                aturMenuBerdasarkanRole();

            } catch (error) {
                console.error('Gagal memuat tampilan:', error);

                tampilkanNotifikasi(
                    'Gagal memuat header atau footer: ' + error.message,
                    'danger'
                );
            }
        }

        // =========================
        // LOGOUT
        // =========================

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // =========================
        // MEMUAT PILIHAN BARANG
        // =========================

        async function loadSelectBarang() {
            const select = document.getElementById('barang_id');

            try {
                const { data, error } = await db
                    .from('barang')
                    .select('id, kode_barang, nama_barang')
                    .order('nama_barang');

                if (error) throw error;

                select.innerHTML = '<option value="">Pilih barang</option>';

                (data || []).forEach(b => {
                    const option = document.createElement('option');

                    option.value = b.id;
                    option.textContent =
                        `${b.kode_barang} - ${b.nama_barang}`;

                    select.appendChild(option);
                });

                if (!data || data.length === 0) {
                    tampilkanNotifikasi(
                        'Belum ada barang di inventaris. Tambahkan barang terlebih dahulu.',
                        'warning'
                    );
                }

            } catch (error) {
                console.error('Gagal memuat pilihan barang:', error);

                select.innerHTML =
                    '<option value="">Gagal memuat barang</option>';

                tampilkanNotifikasi(
                    'Gagal memuat pilihan barang: ' + error.message,
                    'danger'
                );
            }
        }

        // =========================
        // MEMUAT DAFTAR LAPORAN
        // =========================

        async function loadLaporan() {
            const tbody = document.getElementById('tabelLaporan');

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-center py-3">
                        Memuat data...
                    </td>
                </tr>`;

            try {
                const { data, error } = await db
                    .from('laporan_kerusakan')
                    .select('*, barang(kode_barang, nama_barang, lokasi)')
                    .order('id', { ascending: false });

                if (error) throw error;

                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="6"
                                class="text-center text-secondary py-4">
                                Belum ada laporan kerusakan.
                            </td>
                        </tr>`;
                    return;
                }

                data.forEach(l => {
                    const tr = document.createElement('tr');

                    // TANGGAL
                    const tdTanggal = document.createElement('td');
                    tdTanggal.textContent = l.tanggal || '-';

                    // BARANG
                    const tdBarang = document.createElement('td');

                    const namaBarang = document.createElement('strong');
                    namaBarang.textContent =
                        `${l.barang?.kode_barang || '-'} - ${l.barang?.nama_barang || '-'}`;

                    const lokasi = document.createElement('div');
                    lokasi.className = 'small text-secondary';
                    lokasi.textContent =
                        `Lokasi: ${l.barang?.lokasi || '-'}`;

                    tdBarang.append(namaBarang, lokasi);

                    // PELAPOR
                    const tdPelapor = document.createElement('td');
                    tdPelapor.textContent = l.pelapor || '-';

                    // DESKRIPSI
                    const tdDeskripsi = document.createElement('td');
                    tdDeskripsi.textContent = l.deskripsi || '-';

                    // STATUS DAN TINDAK LANJUT
                    const tdStatus = document.createElement('td');

                    const selectStatus = document.createElement('select');
                    selectStatus.className =
                        'form-select form-select-sm mb-2';

                    ['Menunggu', 'Diproses', 'Selesai'].forEach(status => {
                        const option = document.createElement('option');

                        option.value = status;
                        option.textContent = status;
                        option.selected =
                            (l.status || 'Menunggu') === status;

                        selectStatus.appendChild(option);
                    });

                    const inputTindak = document.createElement('textarea');
                    inputTindak.className =
                        'form-control form-control-sm';
                    inputTindak.rows = 2;
                    inputTindak.placeholder = 'Tindak lanjut';
                    inputTindak.value = l.tindak_lanjut || '';

                    // PETUGAS HANYA DAPAT MELIHAT
                    if (roleAktif !== 'admin') {
                        selectStatus.disabled = true;
                        inputTindak.readOnly = true;
                    }

                    tdStatus.append(selectStatus, inputTindak);

                    // AKSI
                    const tdAksi = document.createElement('td');
                    const grupTombol = document.createElement('div');
                    grupTombol.className = 'd-flex gap-2 flex-wrap';

                    if (roleAktif === 'admin') {
                        const btnSimpan =
                            document.createElement('button');

                        btnSimpan.type = 'button';
                        btnSimpan.className = 'btn btn-sm btn-primary';
                        btnSimpan.textContent = 'Simpan';

                        btnSimpan.addEventListener('click', () => {
                            updateLaporan(
                                l.id,
                                selectStatus.value,
                                inputTindak.value,
                                btnSimpan
                            );
                        });

                        const btnHapus =
                            document.createElement('button');

                        btnHapus.type = 'button';
                        btnHapus.className =
                            'btn btn-sm btn-outline-danger';
                        btnHapus.textContent = 'Hapus';

                        btnHapus.addEventListener('click', () => {
                            hapusLaporan(l.id, btnHapus);
                        });

                        grupTombol.append(btnSimpan, btnHapus);

                    } else {
                        grupTombol.textContent = 'Hanya Admin';
                    }

                    tdAksi.appendChild(grupTombol);

                    tr.append(
                        tdTanggal,
                        tdBarang,
                        tdPelapor,
                        tdDeskripsi,
                        tdStatus,
                        tdAksi
                    );

                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Gagal memuat laporan:', error);

                tbody.innerHTML = `
                    <tr>
                        <td colspan="6"
                            class="text-center text-danger py-4">
                            Gagal memuat laporan.
                        </td>
                    </tr>`;

                tampilkanNotifikasi(
                    'Gagal memuat laporan: ' + error.message,
                    'danger'
                );
            }
        }

        // =========================
        // MENGIRIM LAPORAN
        // ADMIN DAN PETUGAS DAPAT MELAPOR
        // =========================

        document.getElementById('laporanForm')
            .addEventListener('submit', async function(e) {
                e.preventDefault();

                if (!loginValid) return;

                const btn = document.getElementById('btnKirim');

                btn.disabled = true;
                btn.textContent = 'Mengirim...';

                try {
                    const barangId =
                        document.getElementById('barang_id').value;

                    const pelapor =
                        document.getElementById('pelapor').value.trim();

                    const tanggal =
                        document.getElementById('tanggal').value;

                    const deskripsi =
                        document.getElementById('deskripsi').value.trim();

                    if (!barangId || !pelapor || !tanggal || !deskripsi) {
                        tampilkanNotifikasi(
                            'Lengkapi semua kolom yang wajib diisi.',
                            'warning'
                        );
                        return;
                    }

                    const { error } = await db
                        .from('laporan_kerusakan')
                        .insert([{
                            barang_id: barangId,
                            pelapor: pelapor,
                            tanggal: tanggal,
                            deskripsi: deskripsi,
                            status: 'Menunggu'
                        }]);

                    if (error) throw error;

                    document.getElementById('laporanForm').reset();
                    document.getElementById('tanggal').value =
                        tanggalLokal();

                    tampilkanNotifikasi(
                        'Laporan kerusakan berhasil dikirim!',
                        'success'
                    );

                    await loadLaporan();

                } catch (error) {
                    console.error('Gagal mengirim laporan:', error);

                    tampilkanNotifikasi(
                        'Gagal mengirim laporan: ' + error.message,
                        'danger'
                    );

                } finally {
                    btn.disabled = false;
                    btn.textContent = 'Kirim Laporan';
                }
            });

        // =========================
        // UPDATE LAPORAN: ADMIN
        // =========================

        async function updateLaporan(id, status, tindak_lanjut, tombol) {
            if (roleAktif !== 'admin') {
                tampilkanNotifikasi(
                    'Hanya Admin yang dapat memperbarui laporan.',
                    'danger'
                );
                return;
            }

            tombol.disabled = true;
            tombol.textContent = 'Menyimpan...';

            try {
                const { data, error } = await db
                    .from('laporan_kerusakan')
                    .update({
                        status: status,
                        tindak_lanjut: tindak_lanjut.trim()
                    })
                    .eq('id', id)
                    .select('id');

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error(
                        'Tidak ada data yang diperbarui. Periksa izin UPDATE di Supabase.'
                    );
                }

                tampilkanNotifikasi(
                    'Status dan tindak lanjut berhasil diperbarui!',
                    'success'
                );

                await loadLaporan();

            } catch (error) {
                console.error('Gagal memperbarui laporan:', error);

                tampilkanNotifikasi(
                    'Gagal memperbarui laporan: ' + error.message,
                    'danger'
                );

                tombol.disabled = false;
                tombol.textContent = 'Simpan';
            }
        }

        // =========================
        // HAPUS LAPORAN: ADMIN
        // =========================

        async function hapusLaporan(id, tombol) {
            if (roleAktif !== 'admin') {
                tampilkanNotifikasi(
                    'Hanya Admin yang dapat menghapus laporan.',
                    'danger'
                );
                return;
            }

            if (!confirm(
                'Yakin ingin menghapus laporan ini? Data yang dihapus tidak dapat dikembalikan.'
            )) {
                return;
            }

            if (tombol) {
                tombol.disabled = true;
                tombol.textContent = 'Menghapus...';
            }

            try {
                const { data, error } = await db
                    .from('laporan_kerusakan')
                    .delete()
                    .eq('id', id)
                    .select('id');

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error(
                        'Tidak ada data yang dihapus. Periksa izin DELETE di Supabase.'
                    );
                }

                tampilkanNotifikasi(
                    'Laporan kerusakan berhasil dihapus!',
                    'success'
                );

                await loadLaporan();

            } catch (error) {
                console.error('Gagal menghapus laporan:', error);

                tampilkanNotifikasi(
                    'Gagal menghapus laporan: ' + error.message,
                    'danger'
                );

                if (tombol) {
                    tombol.disabled = false;
                    tombol.textContent = 'Hapus';
                }
            }
        }

        // =========================
        // JALANKAN HALAMAN
        // =========================

        async function init() {
            if (!loginValid) return;

            await loadIncludes();
            await loadSelectBarang();
            await loadLaporan();
        }

        init();
    </script>

</body>
</html>
