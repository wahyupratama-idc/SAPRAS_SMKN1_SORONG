
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Peminjaman | Sapras Sekolah</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="header-container"></div>

    <main class="container my-4 flex-grow-1">

        <h1 class="h3 fw-bold mb-3">Peminjaman dan Pengembalian</h1>

        <div id="notifikasi" class="alert d-none" role="alert"></div>

        <!-- FORM PEMINJAMAN: KHUSUS PETUGAS -->
        <div class="card p-4 mb-4 shadow-sm" id="formPinjamCard">
            <h2 class="h5 mb-3">Catat Peminjaman</h2>

            <form id="pinjamForm" class="row g-3">

                <div class="col-md-6">
                    <label class="form-label" for="pinjam_barang_id">Barang</label>
                    <select class="form-select" id="pinjam_barang_id" required>
                        <option value="">Memuat barang...</option>
                    </select>
                    <div id="infoStok" class="form-text">
                        Pilih barang untuk melihat stok tersedia.
                    </div>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="nama_peminjam">Nama Peminjam</label>
                    <input type="text" class="form-control"
                           id="nama_peminjam" maxlength="100" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" class="form-control"
                           id="email" maxlength="254"
                           placeholder="contoh@email.com" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label" for="no_tlp">Nomor Telepon</label>
                    <input type="tel" class="form-control"
                           id="no_tlp" maxlength="20"
                           placeholder="Contoh: 08xxxxxxxxxx" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="kelas_bagian">
                        Status Peminjam
                    </label>
                    <select class="form-select" id="kelas_bagian" required>
                        <option value="">Pilih status peminjam</option>
                        <option value="Siswa">Siswa</option>
                        <option value="Guru">Guru</option>
                        <option value="TU">TU (Tata Usaha)</option>
                        <option value="Staf">Staf Sekolah</option>
                        <option value="Petugas Perpustakaan">Petugas Perpustakaan</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label" for="pinjam_jumlah">Jumlah</label>
                    <input type="number" class="form-control"
                           id="pinjam_jumlah" min="1" step="1"
                           value="1" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label" for="tanggal_pinjam">Tanggal Pinjam</label>
                    <input type="date" class="form-control"
                           id="tanggal_pinjam" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label" for="tanggal_kembali_rencana">
                        Rencana Kembali
                    </label>
                    <input type="date" class="form-control"
                           id="tanggal_kembali_rencana" required>
                </div>

                <div class="col-12">
                    <label class="form-label" for="tujuan">Tujuan Peminjaman</label>
                    <textarea class="form-control" id="tujuan" rows="2"></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="btnPinjam">
                        Simpan Peminjaman
                    </button>
                </div>

            </form>
        </div>

        <!-- DAFTAR PEMINJAMAN -->
        <div class="card p-3 shadow-sm">
            <h2 class="h5 mb-3">Daftar Peminjaman</h2>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Barang</th>
                            <th>Peminjam</th>
                            <th>Email</th>
                            <th>Nomor Telepon</th>
                            <th>Jumlah</th>
                            <th>Tanggal Pinjam</th>
                            <th>Rencana Kembali</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelPinjam">
                        <tr>
                            <td colspan="9" class="text-center py-3">
                                Memuat data...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        // =========================
        // CEK LOGIN DAN ROLE
        // =========================

        let akunAktif = null;

        try {
            akunAktif = JSON.parse(
                localStorage.getItem('user') || 'null'
            );
        } catch (error) {
            localStorage.removeItem('user');
        }

        const roleAktif = String(akunAktif?.role || '')
            .toLowerCase()
            .trim();

        const loginValid = Boolean(
            akunAktif &&
            ['admin', 'petugas'].includes(roleAktif)
        );

        if (!loginValid) {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ADMIN TIDAK DAPAT MELIHAT FORM CATAT PEMINJAMAN
        if (loginValid && roleAktif === 'admin') {
            document.getElementById('formPinjamCard').style.display = 'none';
        }

        // =========================
        // NOTIFIKASI
        // =========================

        let timerNotifikasi;

        function tampilkanNotifikasi(pesan, tipe = 'success') {
            const elemen = document.getElementById('notifikasi');

            clearTimeout(timerNotifikasi);

            elemen.textContent = pesan;
            elemen.className = 'alert alert-' + tipe;
            elemen.style.display = 'block';

            timerNotifikasi = setTimeout(function() {
                elemen.classList.add('d-none');
                elemen.style.display = 'none';
            }, 3000);
        }

        // =========================
        // MENU BERDASARKAN ROLE
        // =========================

        function aturMenuBerdasarkanRole() {
            const menuAdmin = [
                'barang.html',
                'kerusakan.html',
                'stok_admin.html',
                'mutasi.html'
            ];
            const isAdmin = roleAktif === 'admin';

            // Terapkan aturan ke setiap tautan menu admin setelah header dimuat.
            document.querySelectorAll('#header-container a[href]')
                .forEach(function(link) {
                    const href = String(link.getAttribute('href') || '')
                        .trim()
                        .split(/[?#]/)[0];

                    const namaHalaman = href
                        .split('/')
                        .pop()
                        .trim()
                        .toLowerCase();

                    const itemMenu =
                        link.closest('li.nav-item') || link;

                    if (menuAdmin.includes(namaHalaman)) {
                        if (isAdmin) {
                            itemMenu.style.removeProperty('display');
                            itemMenu.removeAttribute('hidden');
                            itemMenu.removeAttribute('aria-hidden');
                        } else {
                            itemMenu.style.setProperty('display', 'none', 'important');
                            itemMenu.setAttribute('hidden', '');
                            itemMenu.setAttribute('aria-hidden', 'true');
                        }
                    }
                });

            // Pengaman tambahan: semua menu berkelas admin-only tidak tampil
            // pada akun Petugas, termasuk Mutasi Barang.
            if (!isAdmin) {
                document.querySelectorAll('#header-container .admin-only')
                    .forEach(function(menu) {
                        menu.style.setProperty('display', 'none', 'important');
                        menu.setAttribute('hidden', '');
                        menu.setAttribute('aria-hidden', 'true');
                    });
            }
        }

        // =========================
        // ELEMEN FORM
        // =========================

        const formPinjam = document.getElementById('pinjamForm');
        const selectBarang = document.getElementById('pinjam_barang_id');
        const inputJumlah = document.getElementById('pinjam_jumlah');
        const infoStok = document.getElementById('infoStok');
        const btnPinjam = document.getElementById('btnPinjam');

        let daftarBarang = [];
        let stokTersedia = {};

        // =========================
        // TANGGAL LOKAL
        // =========================

        function tanggalLokal() {
            const sekarang = new Date();
            const tahun = sekarang.getFullYear();
            const bulan = String(sekarang.getMonth() + 1).padStart(2, '0');
            const hari = String(sekarang.getDate()).padStart(2, '0');

            return `${tahun}-${bulan}-${hari}`;
        }

        document.getElementById('tanggal_pinjam').value = tanggalLokal();

        // =========================
        // HEADER DAN FOOTER
        // =========================

        async function loadIncludes() {
            try {
                const [header, footer] = await Promise.all([
                    fetch('header.html'),
                    fetch('footer.html')
                ]);

                if (!header.ok || !footer.ok) {
                    throw new Error('Gagal memuat header atau footer.');
                }

                document.getElementById('header-container').innerHTML =
                    await header.text();

                document.getElementById('footer-container').innerHTML =
                    await footer.text();

                // Atur visibilitas menu setelah header dimuat
                aturMenuBerdasarkanRole();

            } catch (error) {
                console.error(error);

                tampilkanNotifikasi(
                    'Gagal memuat header atau footer: ' + error.message,
                    'danger'
                );
            }
        }

        // LOGOUT
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // =========================
        // HITUNG STOK TERSEDIA
        // =========================

        async function hitungStokTersedia() {
            const { data: barang, error: errorBarang } = await db
                .from('barang')
                .select('id, kode_barang, nama_barang, jumlah')
                .order('nama_barang');

            if (errorBarang) {
                throw new Error(
                    'Gagal membaca inventaris: ' + errorBarang.message
                );
            }

            const { data: pinjaman, error: errorPinjaman } = await db
                .from('peminjaman')
                .select('barang_id, jumlah')
                .eq('status', 'Dipinjam');

            if (errorPinjaman) {
                throw new Error(
                    'Gagal membaca peminjaman: ' + errorPinjaman.message
                );
            }

            const sedangDipinjam = {};

            (pinjaman || []).forEach(p => {
                const id = String(p.barang_id);

                sedangDipinjam[id] =
                    (sedangDipinjam[id] || 0) + Number(p.jumlah || 0);
            });

            const stokBaru = {};

            (barang || []).forEach(b => {
                const total = Number(b.jumlah);

                if (!Number.isFinite(total) || total < 0) {
                    throw new Error(
                        `Stok barang ${b.nama_barang} tidak valid.`
                    );
                }

                stokBaru[String(b.id)] = Math.max(
                    0,
                    total - (sedangDipinjam[String(b.id)] || 0)
                );
            });

            daftarBarang = barang || [];
            stokTersedia = stokBaru;

            tampilkanPilihanBarang();
            perbaruiInfoStok();
        }

        // =========================
        // PILIHAN BARANG
        // =========================

        function tampilkanPilihanBarang() {
            const pilihanSebelumnya = selectBarang.value;

            selectBarang.innerHTML =
                '<option value="">Pilih barang</option>';

            daftarBarang.forEach(b => {
                const tersedia = stokTersedia[String(b.id)] ?? 0;
                const option = document.createElement('option');

                option.value = b.id;
                option.textContent =
                    `${b.kode_barang} - ${b.nama_barang} (tersedia: ${tersedia})`;

                option.disabled = tersedia < 1;
                selectBarang.appendChild(option);
            });

            if (
                pilihanSebelumnya &&
                daftarBarang.some(b => String(b.id) === pilihanSebelumnya)
            ) {
                selectBarang.value = pilihanSebelumnya;
            }
        }

        // INFO STOK
        function perbaruiInfoStok() {
            const id = selectBarang.value;
            const tersedia = stokTersedia[id];

            infoStok.classList.remove('text-danger');

            if (!id || tersedia === undefined) {
                inputJumlah.removeAttribute('max');
                infoStok.textContent =
                    'Pilih barang untuk melihat stok tersedia.';
                return;
            }

            inputJumlah.max = tersedia;

            if (tersedia < 1) {
                infoStok.textContent = 'Stok habis.';
                infoStok.classList.add('text-danger');
            } else {
                infoStok.textContent =
                    `Stok tersedia: ${tersedia} barang.`;
            }
        }

        selectBarang.addEventListener('change', perbaruiInfoStok);

        inputJumlah.addEventListener('input', () => {
            const tersedia = stokTersedia[selectBarang.value];

            if (
                tersedia !== undefined &&
                Number(inputJumlah.value) > tersedia
            ) {
                infoStok.textContent =
                    `Jumlah melebihi stok! Maksimal ${tersedia} barang.`;

                infoStok.classList.add('text-danger');
            } else {
                perbaruiInfoStok();
            }
        });

        // =========================
        // MEMUAT DAFTAR PEMINJAMAN
        // =========================

        async function loadPinjaman() {
            const tbody = document.getElementById('tabelPinjam');

            tbody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center py-3">
                        Memuat data...
                    </td>
                </tr>`;

            try {
                const { data, error } = await db
                    .from('peminjaman')
                    .select('*, barang(kode_barang, nama_barang)')
                    .order('id', { ascending: false });

                if (error) throw error;

                tbody.innerHTML = '';

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="9"
                                class="text-center text-secondary py-4">
                                Belum ada data peminjaman.
                            </td>
                        </tr>`;
                    return;
                }

                data.forEach(p => {
                    const tr = document.createElement('tr');

                    const tdBarang = document.createElement('td');
                    tdBarang.textContent =
                        `${p.barang?.kode_barang || '-'} - ${p.barang?.nama_barang || '-'}`;

                    const tdNama = document.createElement('td');
                    tdNama.textContent = p.nama_peminjam || '-';

                    if (p.kelas_bagian) {
                        const kelas = document.createElement('div');
                        kelas.className = 'small text-secondary';
                        kelas.textContent = p.kelas_bagian;
                        tdNama.appendChild(kelas);
                    }

                    const tdEmail = document.createElement('td');
                    tdEmail.textContent = p.email || '-';

                    const tdNoTlp = document.createElement('td');
                    tdNoTlp.textContent = p.no_tlp || '-';

                    const tdJumlah = document.createElement('td');
                    tdJumlah.textContent = p.jumlah;

                    const tdTanggal = document.createElement('td');
                    tdTanggal.textContent = p.tanggal_pinjam || '-';

                    const tdRencana = document.createElement('td');
                    tdRencana.textContent =
                        p.tanggal_kembali_rencana || '-';

                    const tdStatus = document.createElement('td');
                    tdStatus.textContent = p.status || '-';

                    if (p.tanggal_kembali) {
                        const kembali = document.createElement('div');
                        kembali.className = 'small text-secondary';
                        kembali.textContent =
                            'Kembali: ' + p.tanggal_kembali;

                        tdStatus.appendChild(kembali);
                    }

                    const tdAksi = document.createElement('td');

                    // AKSI PENGELOLAAN HANYA UNTUK ADMIN
                    if (roleAktif === 'admin') {
                        const grupTombol = document.createElement('div');
                        grupTombol.className = 'd-flex gap-2 flex-wrap';

                        if (p.status === 'Dipinjam') {
                            const tombolKembali =
                                document.createElement('button');

                            tombolKembali.type = 'button';
                            tombolKembali.className =
                                'btn btn-sm btn-success';
                            tombolKembali.textContent = 'Tandai Kembali';

                            tombolKembali.addEventListener(
                                'click',
                                () => kembalikan(p.id, tombolKembali)
                            );

                            grupTombol.appendChild(tombolKembali);
                        }

                        const tombolHapus =
                            document.createElement('button');

                        tombolHapus.type = 'button';
                        tombolHapus.className = 'btn btn-sm btn-danger';
                        tombolHapus.textContent = 'Hapus';

                        tombolHapus.addEventListener(
                            'click',
                            () => hapusPeminjaman(p.id, tombolHapus)
                        );

                        grupTombol.appendChild(tombolHapus);
                        tdAksi.appendChild(grupTombol);

                    } else {
                        tdAksi.textContent = '-';
                    }

                    tr.append(
                        tdBarang,
                        tdNama,
                        tdEmail,
                        tdNoTlp,
                        tdJumlah,
                        tdTanggal,
                        tdRencana,
                        tdStatus,
                        tdAksi
                    );

                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error('Gagal memuat peminjaman:', error);

                tbody.innerHTML = `
                    <tr>
                        <td colspan="9"
                            class="text-center text-danger py-4">
                            Gagal memuat data peminjaman.
                        </td>
                    </tr>`;

                tampilkanNotifikasi(
                    'Gagal memuat peminjaman: ' + error.message,
                    'danger'
                );
            }
        }

        // =========================
        // SIMPAN PEMINJAMAN: PETUGAS
        // =========================

        formPinjam.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (roleAktif !== 'petugas') {
                tampilkanNotifikasi(
                    'Hanya Petugas yang dapat mencatat peminjaman.',
                    'danger'
                );
                return;
            }

            btnPinjam.disabled = true;
            btnPinjam.textContent = 'Memeriksa stok...';

            try {
                await hitungStokTersedia();

                const barangId = selectBarang.value;
                const jumlah = Number(inputJumlah.value);
                const tersedia = stokTersedia[barangId];

                if (!barangId || tersedia === undefined) {
                    tampilkanNotifikasi(
                        'Pilih barang terlebih dahulu.',
                        'warning'
                    );
                    return;
                }

                if (!Number.isInteger(jumlah) || jumlah < 1) {
                    tampilkanNotifikasi(
                        'Jumlah harus berupa bilangan bulat minimal 1.',
                        'warning'
                    );
                    return;
                }

                if (tersedia < 1) {
                    tampilkanNotifikasi('Stok barang habis.', 'warning');
                    return;
                }

                if (jumlah > tersedia) {
                    tampilkanNotifikasi(
                        `Peminjaman ditolak! Stok tersedia hanya ${tersedia} barang.`,
                        'warning'
                    );
                    return;
                }

                const tanggalPinjam =
                    document.getElementById('tanggal_pinjam').value;

                const tanggalRencana =
                    document.getElementById('tanggal_kembali_rencana').value;

                if (
                    !tanggalPinjam ||
                    !tanggalRencana ||
                    tanggalRencana < tanggalPinjam
                ) {
                    tampilkanNotifikasi(
                        'Tanggal kembali wajib diisi dan tidak boleh sebelum tanggal pinjam.',
                        'warning'
                    );
                    return;
                }

                btnPinjam.textContent = 'Menyimpan...';

                const { error } = await db
                    .from('peminjaman')
                    .insert([{
                        barang_id: barangId,
                        nama_peminjam:
                            document.getElementById('nama_peminjam').value.trim(),
                        email:
                            document.getElementById('email').value.trim(),
                        no_tlp:
                            document.getElementById('no_tlp').value.trim(),
                        kelas_bagian:
                            document.getElementById('kelas_bagian').value,
                        jumlah: jumlah,
                        tanggal_pinjam: tanggalPinjam,
                        tanggal_kembali_rencana: tanggalRencana,
                        tujuan:
                            document.getElementById('tujuan').value.trim(),
                        status: 'Dipinjam'
                    }]);

                if (error) throw error;

                formPinjam.reset();
                document.getElementById('tanggal_pinjam').value =
                    tanggalLokal();

                tampilkanNotifikasi(
                    'Peminjaman berhasil disimpan!',
                    'success'
                );

                await hitungStokTersedia();
                await loadPinjaman();

            } catch (error) {
                console.error('Gagal menyimpan peminjaman:', error);

                tampilkanNotifikasi(
                    'Gagal menyimpan peminjaman: ' + error.message,
                    'danger'
                );

            } finally {
                btnPinjam.disabled = false;
                btnPinjam.textContent = 'Simpan Peminjaman';
            }
        });

        // =========================
        // PENGEMBALIAN: ADMIN
        // =========================

        async function kembalikan(id, tombol) {
            if (roleAktif !== 'admin') {
                tampilkanNotifikasi(
                    'Hanya Admin yang dapat mengelola pengembalian.',
                    'danger'
                );
                return;
            }

            if (!confirm('Catat barang sudah dikembalikan?')) return;

            tombol.disabled = true;
            tombol.textContent = 'Memproses...';

            try {
                const { data, error } = await db
                    .from('peminjaman')
                    .update({
                        status: 'Dikembalikan',
                        tanggal_kembali: tanggalLokal()
                    })
                    .eq('id', id)
                    .eq('status', 'Dipinjam')
                    .select('id');

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error(
                        'Data tidak berubah. Periksa izin UPDATE pada Supabase.'
                    );
                }

                tampilkanNotifikasi(
                    'Pengembalian barang berhasil dicatat!',
                    'success'
                );

                await hitungStokTersedia();
                await loadPinjaman();

            } catch (error) {
                console.error('Gagal mengembalikan barang:', error);

                tampilkanNotifikasi(
                    'Gagal mencatat pengembalian: ' + error.message,
                    'danger'
                );

                tombol.disabled = false;
                tombol.textContent = 'Tandai Kembali';
            }
        }

        // =========================
        // HAPUS PEMINJAMAN: ADMIN
        // =========================

        async function hapusPeminjaman(id, tombol) {
            if (roleAktif !== 'admin') {
                tampilkanNotifikasi(
                    'Hanya Admin yang dapat menghapus peminjaman.',
                    'danger'
                );
                return;
            }

            if (!confirm('Yakin ingin menghapus data peminjaman ini?')) {
                return;
            }

            tombol.disabled = true;
            tombol.textContent = 'Menghapus...';

            try {
                const { data, error } = await db
                    .from('peminjaman')
                    .delete()
                    .eq('id', id)
                    .select('id');

                if (error) throw error;

                if (!data || data.length === 0) {
                    throw new Error(
                        'Data tidak terhapus. Periksa izin DELETE pada Supabase.'
                    );
                }

                tampilkanNotifikasi(
                    'Data peminjaman berhasil dihapus!',
                    'success'
                );

                await hitungStokTersedia();
                await loadPinjaman();

            } catch (error) {
                console.error('Gagal menghapus peminjaman:', error);

                tampilkanNotifikasi(
                    'Gagal menghapus peminjaman: ' + error.message,
                    'danger'
                );

                tombol.disabled = false;
                tombol.textContent = 'Hapus';
            }
        }

        // =========================
        // JALANKAN HALAMAN
        // =========================

        async function init() {
            if (!loginValid) return;

            await loadIncludes();

            try {
                await hitungStokTersedia();
                await loadPinjaman();

            } catch (error) {
                console.error(error);

                tampilkanNotifikasi(
                    'Gagal memuat data: ' + error.message,
                    'danger'
                );
            }
        }

        init();
    </script>
