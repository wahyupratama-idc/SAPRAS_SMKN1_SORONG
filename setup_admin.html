<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buat Admin | Sapras Sekolah</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 520px">
        <div class="card p-4 shadow-sm">
            <h1 class="h4 mb-3">Buat Akun Admin Pertama</h1>
            <div id="alertMsg" class="alert d-none"></div>
            <form id="adminForm">
                <div class="mb-3">
                    <label class="form-label">Nama Admin</label>
                    <input type="text" class="form-control" id="nama" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password (minimal 8 karakter)</label>
                    <input type="password" class="form-control" id="password" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Buat Akun</button>
            </form>
            <p class="small text-muted mt-3 mb-0">Jalankan hanya setelah database siap. Setelah berhasil, hapus file ini.</p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script>
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const alertMsg = document.getElementById('alertMsg');

            const { error } = await db.from('users').insert([{
                nama, username, password, role: 'admin'
            }]);

            if (error) {
                alertMsg.className = 'alert alert-danger';
                alertMsg.textContent = 'Gagal membuat admin. Username mungkin sudah digunakan.';
                alertMsg.classList.remove('d-none');
            } else {
                alertMsg.className = 'alert alert-success';
                alertMsg.textContent = 'Admin berhasil dibuat. Demi keamanan, hapus file setup_admin.html sekarang.';
                alertMsg.classList.remove('d-none');
                setTimeout(() => window.location.href = 'login.html', 2000);
            }
        });
    </script>
</body>
</html>
