
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventaris | Sapras Sekolah</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="d-flex flex-column min-vh-100">

    <div id="header-container"></div>

    <main class="container my-4 flex-grow-1">

        <h1 class="h3 fw-bold mb-3">Inventaris Barang</h1>

        <!-- Notifikasi -->
        <div id="notifikasi" class="alert d-none" role="alert"></div>

        <!-- Form Tambah/Edit Barang -->
        <div class="card p-4 mb-4 shadow-sm">
            <h2 class="h5" id="formTitle">Tambah barang</h2>

            <form id="barangForm" class="row g-3">
                <input type="hidden" id="barangId">

                <div class="col-md-3">
                    <label class="form-label" for="kode_barang">Kode barang</label>
                    <input type="text" class="form-control" id="kode_barang" placeholder="INV-001" required>
                </div>

                <div class="col-md-5">
                    <label class="form-label" for="nama_barang">Nama barang</label>
                    <input type="text" class="form-control" id="nama_barang" required>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="kategori">Kategori</label>
                    <input type="text" class="form-control" id="kategori" placeholder="Elektronik, mebel, dll." required>
                </div>

                <div class="col-md-4">
                    <label class="form-label" for="lokasi">Lokasi</label>
                    <input type="text" class="form-control" id="lokasi" placeholder="Lab RPL" required>
                </div>

                <div class="col-md-2">
                    <label class="form-label" for="jumlah">Jumlah</label>
                    <input type="number" class="form-control" id="jumlah" min="1" value="1" required>
                </div>

                <div class="col-md-3">
                    <label class="form-label" for="kondisi">Kondisi</label>
                    <select class="form-select" id="kondisi">
                        <option value="Baik">Baik</option>
                        <option value="Rusak Ringan">Rusak Ringan</option>
                        <option value="Rusak Berat">Rusak Berat</option>
                    </select>
                </div>

                <div class="col-md-3">
                    <label class="form-label" for="tanggal_pengadaan">Tanggal pengadaan</label>
                    <input type="date" class="form-control" id="tanggal_pengadaan">
                </div>

                <div class="col-12">
                    <label class="form-label" for="keterangan">Keterangan</label>
                    <textarea class="form-control" id="keterangan" rows="2"></textarea>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary" id="btnSimpan">
                        Simpan barang
                    </button>

                    <button type="button" class="btn btn-light d-none" id="btnBatal" onclick="resetForm()">
                        Batal edit
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Inventaris dan Pencarian -->
        <div class="card p-3 shadow-sm">
            <div class="row g-2 align-items-center mb-3">
                <div class="col-md-7">
                    <label for="searchBarang" class="form-label mb-1">Cari barang</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white" aria-hidden="true">🔎</span>
                        <input
                            type="search"
                            class="form-control"
                            id="searchBarang"
                            placeholder="Cari kode, nama, kategori, lokasi, atau kondisi..."
                            autocomplete="off"
                            aria-label="Cari inventaris barang">
                        <button type="button" class="btn btn-outline-secondary" id="btnBersihkanCari">Hapus</button>
                    </div>
                </div>
                <div class="col-md-5 text-md-end">
                    <span id="jumlahHasilCari" class="text-secondary small" aria-live="polite">Memuat data...</span>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Kode</th>
                            <th>Barang</th>
                            <th>Kategori</th>
                            <th>Lokasi</th>
                            <th>Jumlah</th>
                            <th>Kondisi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="tabelBarang">
                        <tr>
                            <td colspan="7" class="text-center py-3">
                                Memuat data barang...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <div id="footer-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        // ==============================
        // CEK LOGIN DAN ROLE
        // ==============================
        let userLogin = null;
        let roleUser = '';

        try {
            userLogin = JSON.parse(localStorage.getItem('user') || 'null');
        } catch (error) {
            userLogin = null;
        }

        if (!userLogin) {
            window.location.replace('login.html');
            throw new Error('Pengguna belum login.');
        }

        roleUser = String(userLogin.role || '').toLowerCase().trim();

        if (roleUser !== 'admin' && roleUser !== 'petugas') {
            localStorage.removeItem('user');
            window.location.replace('login.html');
            throw new Error('Role akun tidak valid.');
        }

        // Halaman inventaris hanya untuk admin
        if (roleUser !== 'admin') {
            window.location.replace('dashboard.html');
            throw new Error('Akses ditolak. Halaman ini khusus admin.');
        }

        // ==============================
        // MEMUAT HEADER DAN FOOTER
        // ==============================
        async function loadIncludes() {
            try {
                const hRes = await fetch('header.html');
                if (!hRes.ok) {
                    throw new Error('Header gagal dimuat.');
                }

                document.getElementById('header-container').innerHTML =
                    await hRes.text();

                const fRes = await fetch('footer.html');
                if (!fRes.ok) {
                    throw new Error('Footer gagal dimuat.');
                }

                document.getElementById('footer-container').innerHTML =
                    await fRes.text();

                aturMenuHeader();
            } catch (error) {
                console.error('Gagal memuat tampilan:', error);
            }
        }

        // Mengatur menu berdasarkan role
        function aturMenuHeader() {
            document.querySelectorAll('.admin-only').forEach(function(menu) {
                menu.style.display = roleUser === 'admin' ? '' : 'none';
            });

            document.querySelectorAll('.petugas-only').forEach(function(menu) {
                menu.style.display = roleUser === 'petugas' ? '' : 'none';
            });

            // Menyembunyikan menu admin berdasarkan alamat halaman.
            // Menu Inventaris, Kerusakan, dan Lihat Stok hanya untuk admin.
            document.querySelectorAll('#header-container a[href]').forEach(function(link) {
                const href = link.getAttribute('href');

                if (
                    href === 'barang.html' ||
                    href === 'kerusakan.html' ||
                    href === 'stok_admin.html'
                ) {
                    const menu = link.closest('li') || link;

                    menu.style.display = roleUser === 'admin' ? '' : 'none';
                }
            });
        }

        // Logout
        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        // ==============================
        // NOTIFIKASI
        // ==============================
        function tampilkanNotifikasi(pesan, tipe = 'success') {
            const elemen = document.getElementById('notifikasi');

            elemen.textContent = pesan;
            elemen.className = 'alert alert-' + tipe;
            elemen.style.display = 'block';

            elemen.scrollIntoView({
                behavior: 'smooth',
                block: 'nearest'
            });
        }

        // ==============================
        // MEMUAT DAN MENCARI DATA BARANG
        // ==============================
        let semuaBarang = [];

        async function loadBarang() {
            const tbody = document.getElementById('tabelBarang');
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-center text-secondary py-4">
                        Memuat data barang...
                    </td>
                </tr>`;

            try {
                const { data, error } = await db
                    .from('barang')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                semuaBarang = Array.isArray(data) ? data : [];
                renderBarang();

            } catch (error) {
                console.error('Gagal memuat barang:', error);

                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-danger py-4">
                            Gagal memuat data barang.
                        </td>
                    </tr>`;
                document.getElementById('jumlahHasilCari').textContent = 'Data gagal dimuat';

                tampilkanNotifikasi(
                    'Gagal memuat data barang: ' + error.message,
                    'danger'
                );
            }
        }

        // Merender data sesuai kata kunci pencarian.
        function renderBarang() {
            const tbody = document.getElementById('tabelBarang');
            const inputCari = document.getElementById('searchBarang');
            const kataKunci = (inputCari ? inputCari.value : '').trim().toLocaleLowerCase('id-ID');
            const jumlahHasil = document.getElementById('jumlahHasilCari');

            const hasilFilter = semuaBarang.filter(function(b) {
                const teksBarang = [
                    b.kode_barang,
                    b.nama_barang,
                    b.kategori,
                    b.lokasi,
                    b.jumlah,
                    b.kondisi,
                    b.keterangan
                ].map(function(nilai) {
                    return String(nilai ?? '').toLocaleLowerCase('id-ID');
                }).join(' ');

                return teksBarang.includes(kataKunci);
            });

            tbody.innerHTML = '';

            if (semuaBarang.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-secondary py-4">
                            Belum ada barang. Tambahkan lewat formulir di atas.
                        </td>
                    </tr>`;
                jumlahHasil.textContent = '0 barang';
                return;
            }

            if (hasilFilter.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-secondary py-4">
                            Barang yang dicari tidak ditemukan.
                        </td>
                    </tr>`;
                jumlahHasil.textContent = '0 dari ' + semuaBarang.length + ' barang';
                return;
            }

            hasilFilter.forEach(function(b) {
                const tr = document.createElement('tr');

                function buatSel(nilai) {
                    const td = document.createElement('td');
                    td.textContent = nilai ?? '-';
                    return td;
                }

                tr.appendChild(buatSel(b.kode_barang));
                tr.appendChild(buatSel(b.nama_barang));
                tr.appendChild(buatSel(b.kategori));
                tr.appendChild(buatSel(b.lokasi));
                tr.appendChild(buatSel(b.jumlah));
                tr.appendChild(buatSel(b.kondisi));

                const aksi = document.createElement('td');
                aksi.className = 'text-nowrap';

                const tombolEdit = document.createElement('button');
                tombolEdit.type = 'button';
                tombolEdit.className = 'btn btn-sm btn-outline-primary me-1';
                tombolEdit.textContent = 'Edit';
                tombolEdit.addEventListener('click', function() {
                    editBarang(b.id);
                });

                const tombolHapus = document.createElement('button');
                tombolHapus.type = 'button';
                tombolHapus.className = 'btn btn-sm btn-outline-danger';
                tombolHapus.textContent = 'Hapus';
                tombolHapus.addEventListener('click', function() {
                    hapusBarang(b.id);
                });

                aksi.appendChild(tombolEdit);
                aksi.appendChild(tombolHapus);
                tr.appendChild(aksi);
                tbody.appendChild(tr);
            });

            jumlahHasil.textContent = kataKunci
                ? hasilFilter.length + ' dari ' + semuaBarang.length + ' barang ditemukan'
                : semuaBarang.length + ' barang';
        }

        // Pencarian berlangsung langsung saat pengguna mengetik.
        document.getElementById('searchBarang').addEventListener('input', renderBarang);
        document.getElementById('btnBersihkanCari').addEventListener('click', function() {
            document.getElementById('searchBarang').value = '';
            renderBarang();
            document.getElementById('searchBarang').focus();
        });

        // ==============================
        // SIMPAN BARANG BARU / EDIT
        // ==============================
        document.getElementById('barangForm')
            .addEventListener('submit', async function(e) {
                e.preventDefault();

                // Pemeriksaan role sebelum perubahan data
                if (roleUser !== 'admin') {
                    tampilkanNotifikasi(
                        'Akses ditolak. Hanya admin yang dapat mengelola inventaris.',
                        'danger'
                    );
                    return;
                }

                const tombolSimpan = document.getElementById('btnSimpan');
                const id = document.getElementById('barangId').value;

                const payload = {
                    kode_barang: document.getElementById('kode_barang').value.trim(),
                    nama_barang: document.getElementById('nama_barang').value.trim(),
                    kategori: document.getElementById('kategori').value.trim(),
                    lokasi: document.getElementById('lokasi').value.trim(),
                    jumlah: parseInt(document.getElementById('jumlah').value, 10),
                    kondisi: document.getElementById('kondisi').value,
                    tanggal_pengadaan:
                        document.getElementById('tanggal_pengadaan').value || null,
                    keterangan: document.getElementById('keterangan').value.trim()
                };

                tombolSimpan.disabled = true;
                tombolSimpan.textContent = 'Menyimpan...';

                try {
                    let hasil;

                    if (id) {
                        hasil = await db
                            .from('barang')
                            .update(payload)
                            .eq('id', id);
                    } else {
                        hasil = await db
                            .from('barang')
                            .insert([payload]);
                    }

                    if (hasil.error) throw hasil.error;

                    tampilkanNotifikasi(
                        id
                            ? 'Barang berhasil diperbarui!'
                            : 'Barang berhasil disimpan!',
                        'success'
                    );

                    resetForm();
                    await loadBarang();

                } catch (error) {
                    console.error('Gagal menyimpan barang:', error);

                    tampilkanNotifikasi(
                        'Gagal menyimpan barang: ' + error.message,
                        'danger'
                    );

                } finally {
                    tombolSimpan.disabled = false;
                    tombolSimpan.textContent = 'Simpan barang';
                }
            });

        // ==============================
        // EDIT BARANG
        // ==============================
        async function editBarang(id) {
            if (roleUser !== 'admin') {
                tampilkanNotifikasi('Akses ditolak.', 'danger');
                return;
            }

            try {
                const { data, error } = await db
                    .from('barang')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error) throw error;

                document.getElementById('barangId').value = data.id;
                document.getElementById('kode_barang').value = data.kode_barang || '';
                document.getElementById('nama_barang').value = data.nama_barang || '';
                document.getElementById('kategori').value = data.kategori || '';
                document.getElementById('lokasi').value = data.lokasi || '';
                document.getElementById('jumlah').value = data.jumlah ?? 1;
                document.getElementById('kondisi').value = data.kondisi || 'Baik';
                document.getElementById('tanggal_pengadaan').value =
                    data.tanggal_pengadaan || '';
                document.getElementById('keterangan').value =
                    data.keterangan || '';

                document.getElementById('formTitle').textContent = 'Edit barang';
                document.getElementById('btnSimpan').textContent = 'Perbarui barang';
                document.getElementById('btnBatal').classList.remove('d-none');

                document.getElementById('barangForm').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });

            } catch (error) {
                console.error('Gagal mengambil data barang:', error);

                tampilkanNotifikasi(
                    'Gagal membuka data untuk diedit: ' + error.message,
                    'danger'
                );
            }
        }

        // ==============================
        // RESET FORMULIR
        // ==============================
        function resetForm() {
            document.getElementById('barangForm').reset();
            document.getElementById('barangId').value = '';
            document.getElementById('formTitle').textContent = 'Tambah barang';
            document.getElementById('btnSimpan').textContent = 'Simpan barang';
            document.getElementById('btnBatal').classList.add('d-none');
        }

        // ==============================
        // HAPUS BARANG
        // ==============================
        async function hapusBarang(id) {
            if (roleUser !== 'admin') {
                tampilkanNotifikasi('Akses ditolak.', 'danger');
                return;
            }

            if (!confirm('Yakin ingin menghapus barang ini?')) {
                return;
            }

            try {
                const { error } = await db
                    .from('barang')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                tampilkanNotifikasi('Barang berhasil dihapus!', 'success');
                await loadBarang();

            } catch (error) {
                console.error('Gagal menghapus barang:', error);

                tampilkanNotifikasi(
                    'Gagal menghapus barang: ' + error.message,
                    'danger'
                );
            }
        }

        // ==============================
        // JALANKAN SAAT HALAMAN DIBUKA
        // ==============================
        loadIncludes();
        loadBarang();
    </script>

</body>
</html>
