
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Sapras Sekolah</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f172a, #1d4ed8);
}

.card {
    width: 100%;
    max-width: 440px;
    background: white;
    padding: 30px;
    border-radius: 16px;
}


.identitas-sekolah {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    margin-bottom: 18px;
}

.logo-samping {
    width: 55px;
    height: 55px;
    object-fit: contain;
    flex-shrink: 0;
}

.teks-sapras {
    flex: 1;
    min-width: 0;
    text-align: center;
}


.teks-sapras h3 {
    margin: 0;
    font-size: 25px;
    font-weight: bold;
    color: #1d4ed8;
    white-space: nowrap;
}

.teks-sapras p {
    margin: 5px 0 0;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
}



h2 {
    text-align: center;
    color: #1d4ed8;
}

p {
    text-align: center;
    color: #64748b;
}

label {
    display: block;
    margin: 16px 0 6px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #2563eb;
    color: white;
    border: 0;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.7;
    cursor: wait;
}

#pesan {
    margin-top: 15px;
    color: #b91c1c;
    overflow-wrap: anywhere;
}

a {
    color: #2563eb;
}

@media (max-width: 380px) {
    .card {
        padding: 22px;
    }

    .logo-samping {
        width: 34px;
        height: 34px;
    }

    .teks-sapras h3 {
        font-size: 17px;
    }

    .teks-sapras p {
        font-size: 10px;
    }
}
</style>
</head>

<body>
<div class="card">

    <!-- Logo kiri, tulisan SAPRAS tengah, logo kanan -->
    <div class="identitas-sekolah">
        <img
            src="smk.jpg"
            alt="Logo SMK Negeri 1 Kota Sorong"
            class="logo-samping"
        >

        <div class="teks-sapras">
            <h3>Sapras Sekolah</h3>
            <p>SMK Negeri 1 Kota Sorong</p>
        </div>

        <img
            src="tutwuri.png"
            alt="Logo Tut Wuri Handayani"
            class="logo-samping"
        >
    </div>

    <h2>Login</h2>
    <p>Masuk ke sistem sarana dan prasarana sekolah.</p>

    <form id="formLogin">
        <label for="username">Username</label>
        <input
            id="username"
            autocomplete="username"
            required
        >

        <label for="password">Password</label>
        <input
            id="password"
            type="password"
            autocomplete="current-password"
            required
        >

        <button id="btnLogin" type="submit">Login</button>
        <div id="pesan" role="status"></div>
    </form>

    <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>

</div>

<script>
const formLogin = document.getElementById('formLogin');
const pesanLogin = document.getElementById('pesan');
const btnLogin = document.getElementById('btnLogin');

formLogin.addEventListener('submit', async function(e) {
    e.preventDefault();

    const username = document.getElementById('username')
        .value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    btnLogin.disabled = true;
    btnLogin.textContent = 'Memeriksa...';
    pesanLogin.textContent = '';

    try {
        const { data, error } = await db
            .from('users')
            .select('id, username, nama, password, role')
            .eq('username', username)
            .maybeSingle();

        if (error) throw error;

        if (!data || data.password !== password) {
            pesanLogin.textContent = 'Username atau password salah.';
            return;
        }

        const role = String(data.role || '').toLowerCase().trim();

        if (!['admin', 'petugas'].includes(role)) {
            pesanLogin.textContent = 'Role akun tidak valid.';
            return;
        }

        localStorage.setItem('user', JSON.stringify({
            id: data.id,
            username: data.username,
            nama: data.nama,
            role: role
        }));

        window.location.href = 'dashboard.html';

    } catch (error) {
        console.error(error);
        pesanLogin.textContent = 'Login gagal: ' + error.message;
    } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Login';
    }
});
</script>
</body>
</html>
